<style>
/* =========================================================
   RADAR EMPRESARIAL BRASIL — Identidade visual preto e dourado
   ========================================================= */
:root {
  --black: #080808;
  --black-2: #121212;
  --graphite: #1C1C1C;
  --graphite-2: #242424;
  --gold: #D4AF37;
  --gold-light: #F5D76E;
  --white: #FFFFFF;
  --gray: #A1A1A1;
  --gray-dark: #5c5c5c;

  --gold-line: rgba(212, 175, 55, 0.18);
  --gold-line-strong: rgba(212, 175, 55, 0.42);
  --gold-glow: 0 0 0 1px rgba(212,175,55,.25), 0 8px 30px -12px rgba(212,175,55,.35);
  --shadow: 0 12px 32px -16px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.5);
  --gold-gradient: linear-gradient(135deg, #F5D76E 0%, #D4AF37 45%, #A8862A 100%);
  --danger: #E06C5A;
  --ok: #7FBF7A;
  --warn: #E3B04B;

  --radius: 14px;
  --radius-sm: 10px;
  --sidebar-w: 264px;
  --font-display: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--black);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(212,175,55,.06), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(212,175,55,.04), transparent 60%);
  background-attachment: fixed;
  color: var(--white);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold-light); text-decoration: none; }
::selection { background: rgba(212,175,55,.35); }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: linear-gradient(180deg, #0b0b0b 0%, #080808 100%);
  border-right: 1px solid var(--gold-line);
  display: flex; flex-direction: column; z-index: 40;
  transition: transform .35s var(--ease);
}
.brand { padding: 26px 22px 22px; border-bottom: 1px solid var(--gold-line); display: flex; gap: 12px; align-items: center; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px; flex: none;
  background: radial-gradient(circle at 30% 25%, #2a2414, #0d0d0d 70%);
  border: 1px solid var(--gold-line-strong);
  display: grid; place-items: center; box-shadow: var(--gold-glow);
}
.brand-mark svg { width: 24px; height: 24px; }
.brand-text { line-height: 1.1; }
.brand-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .14em; color: var(--white); }
.brand-sub { font-size: 10.5px; letter-spacing: .38em; color: var(--gold); margin-top: 4px; }

.nav { padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav-label { font-size: 10.5px; letter-spacing: .22em; color: var(--gray-dark); padding: 6px 12px 8px; text-transform: uppercase; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm);
  color: var(--gray); font-size: 14.5px; position: relative; border: 1px solid transparent;
  transition: color .2s, background .2s, border-color .2s;
}
.nav a svg { width: 19px; height: 19px; stroke: var(--gold); opacity: .75; flex: none; transition: opacity .2s; }
.nav a:hover { color: var(--white); background: rgba(255,255,255,.02); }
.nav a:hover svg { opacity: 1; }
.nav a.active {
  color: var(--white); background: linear-gradient(90deg, rgba(212,175,55,.12), rgba(212,175,55,.02));
  border-color: var(--gold-line);
}
.nav a.active::before {
  content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0;
  background: var(--gold-gradient); box-shadow: 0 0 12px rgba(212,175,55,.6);
}
.nav a.active svg { opacity: 1; }
.sidebar-foot { padding: 16px 22px 22px; border-top: 1px solid var(--gold-line); font-size: 12px; color: var(--gray-dark); }
.sidebar-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.main { flex: 1; margin-left: var(--sidebar-w); min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 18px 36px; background: rgba(8,8,8,.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--gold-line);
}
.topbar h1 { font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .02em; margin: 0; }
.topbar .crumb { color: var(--gray); font-size: 13px; margin-left: auto; }
.menu-btn { display: none; background: none; border: 1px solid var(--gold-line); border-radius: 10px; width: 40px; height: 40px; color: var(--gold); cursor: pointer; }
.menu-btn svg { width: 20px; height: 20px; stroke: var(--gold); }
.content { padding: 30px 36px 60px; max-width: 1320px; animation: fadeUp .45s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

.scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 35; }

/* ---------- Typography helpers ---------- */
.eyebrow { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--gray); }
.section-title { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 0 0 4px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 34px 0 14px; flex-wrap: wrap; }
.section-head:first-child { margin-top: 0; }
.gold-text { background: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Cards ---------- */
.card {
  background: linear-gradient(180deg, var(--black-2), #0e0e0e);
  border: 1px solid var(--gold-line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 22px; position: relative;
  transition: border-color .25s, transform .25s var(--ease), box-shadow .25s;
}
.card.hover:hover { border-color: var(--gold-line-strong); transform: translateY(-2px); box-shadow: var(--shadow), var(--gold-glow); }
.card-graphite { background: var(--graphite); }
.grid { display: grid; gap: 18px; }
.grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (min-width: 1240px) { .grid-kpi { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.grid-panels { grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.kpi { padding: 20px 20px 18px; overflow: hidden; }
.kpi::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(212,175,55,.12), transparent 70%);
}
.kpi-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--gold-line); background: rgba(212,175,55,.06); margin-bottom: 14px; }
.kpi-icon svg { width: 18px; height: 18px; stroke: var(--gold); }
.kpi-value { font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1; }
.kpi-label { color: var(--gray); font-size: 13px; margin-top: 8px; }
.kpi-note { font-size: 11px; color: var(--gray-dark); margin-top: 6px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  font: 600 13px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase;
  padding: 13px 18px; border-radius: 10px; border: 1px solid var(--gold-line-strong);
  background: transparent; color: var(--gold-light); transition: all .2s var(--ease); white-space: nowrap;
}
.btn svg { width: 16px; height: 16px; stroke: currentColor; }
.btn:hover { background: rgba(212,175,55,.08); border-color: var(--gold); }
.btn-gold { background: var(--gold-gradient); color: #121006; border-color: transparent; box-shadow: 0 6px 22px -10px rgba(212,175,55,.7); }
.btn-gold:hover { filter: brightness(1.07); box-shadow: 0 8px 28px -8px rgba(212,175,55,.8); background: var(--gold-gradient); }
.btn-ghost { border-color: rgba(255,255,255,.08); color: var(--gray); }
.btn-ghost:hover { color: var(--white); border-color: var(--gold-line-strong); }
.btn-lg { padding: 16px 24px; font-size: 14px; }
.btn-block { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.6); box-shadow: none; }
.btn-wa { background: linear-gradient(135deg,#F5D76E,#D4AF37 55%,#B8922C); color: #0c0a04; border: none; }

/* ---------- Forms ---------- */
label.field { display: flex; flex-direction: column; gap: 7px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--gray); }
.input, select.input, textarea.input {
  width: 100%; background: #0b0b0b; color: var(--white); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 13px 14px; font: 400 15px var(--font-body); outline: none;
  transition: border-color .2s, box-shadow .2s; text-transform: none; letter-spacing: 0;
}
.input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.14); }
textarea.input { resize: vertical; min-height: 130px; line-height: 1.5; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; color: var(--white); font-size: 14px; }
.toggle input { display: none; }
.toggle .sw { width: 40px; height: 22px; border-radius: 22px; background: #2a2a2a; border: 1px solid rgba(255,255,255,.08); position: relative; transition: background .2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--gray); transition: transform .25s var(--ease), background .2s; }
.toggle input:checked + .sw { background: rgba(212,175,55,.25); border-color: var(--gold-line-strong); }
.toggle input:checked + .sw::after { transform: translateX(18px); background: var(--gold-light); }

/* ---------- Chips / badges ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08); color: var(--gray); font-size: 13px; cursor: pointer; background: transparent; transition: all .2s; font-family: var(--font-body); }
.chip:hover { color: var(--white); border-color: var(--gold-line-strong); }
.chip.active { color: #111; background: var(--gold-gradient); border-color: transparent; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: .06em; padding: 5px 10px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-off { color: var(--gray); border-color: rgba(255,255,255,.1); }
.badge-warn { color: var(--warn); border-color: rgba(227,176,75,.35); }
.badge-ok { color: var(--ok); border-color: rgba(127,191,122,.35); }
.badge-err { color: var(--danger); border-color: rgba(224,108,90,.35); }
.badge-gold { color: var(--gold-light); border-color: var(--gold-line-strong); }

/* ---------- Empty / notice ---------- */
.empty { text-align: center; padding: 46px 20px; color: var(--gray); }
.empty .ico { width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; border: 1px dashed var(--gold-line-strong); }
.empty .ico svg { width: 24px; height: 24px; stroke: var(--gold); }
.empty h3 { color: var(--white); font-family: var(--font-display); font-size: 21px; margin: 0 0 6px; font-weight: 600; }
.empty p { margin: 0 auto; max-width: 480px; font-size: 14px; }
.notice { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 12px; border: 1px solid rgba(227,176,75,.3); background: rgba(227,176,75,.05); font-size: 14px; }
.notice svg { width: 20px; height: 20px; stroke: var(--warn); flex: none; margin-top: 2px; }
.notice.info { border-color: var(--gold-line); background: rgba(212,175,55,.04); }
.notice.info svg { stroke: var(--gold); }
.notice.err { border-color: rgba(224,108,90,.35); background: rgba(224,108,90,.06); }
.notice.err svg { stroke: var(--danger); }
.notice strong { color: var(--white); }
.notice code, code { background: #1a1a1a; border: 1px solid rgba(255,255,255,.06); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; color: var(--gold-light); }

/* ---------- Company card ---------- */
.company-card { display: flex; flex-direction: column; gap: 14px; }
.company-card .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.company-card h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.2; }
.company-card .cat { font-size: 12px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }
.company-card dl { margin: 0; display: grid; grid-template-columns: 22px 1fr; gap: 9px 10px; font-size: 14px; }
.company-card dt svg { width: 16px; height: 16px; stroke: var(--gold); margin-top: 2px; }
.company-card dd { margin: 0; color: #d9d9d9; overflow-wrap: anywhere; }
.company-card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.company-card .actions .btn-wa { grid-column: 1 / -1; padding: 15px; font-size: 13.5px; }
.company-card .actions .btn { padding: 11px 10px; font-size: 11.5px; }
.skeleton { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, #1a1a1a, #242424, #1a1a1a); background-size: 200% 100%; animation: shimmer 1.6s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.preview-tag { position: absolute; top: -10px; left: 18px; background: var(--black); border: 1px solid var(--gold-line-strong); color: var(--gold); font-size: 10.5px; letter-spacing: .2em; padding: 3px 10px; border-radius: 999px; }

/* ---------- Tables / lists ---------- */
.list { display: flex; flex-direction: column; }
.list-row { display: flex; align-items: center; gap: 14px; padding: 13px 4px; border-bottom: 1px solid rgba(255,255,255,.05); }
.list-row:last-child { border-bottom: none; }
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gray); font-weight: 500; padding: 12px 14px; border-bottom: 1px solid var(--gold-line); }
.tbl td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,.05); }

/* ---------- Shortcuts ---------- */
.shortcut { display: flex; align-items: center; gap: 14px; color: var(--white); padding: 18px; }
.shortcut .kpi-icon { margin: 0; flex: none; }
.shortcut b { display: block; font-weight: 600; font-size: 15px; }
.shortcut span { color: var(--gray); font-size: 13px; }
.shortcut .arrow { margin-left: auto; stroke: var(--gold); width: 18px; height: 18px; transition: transform .2s; }
.shortcut:hover .arrow { transform: translateX(4px); }

/* ---------- Chart placeholder ---------- */
.chart-box { height: 230px; position: relative; border-radius: 12px; overflow: hidden; background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 46px); display: grid; place-items: center; }

/* ---------- Creator ---------- */
.creator-hero { text-align: center; padding: 56px 24px 48px; overflow: hidden; }
.creator-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 240px at 50% 0%, rgba(212,175,55,.12), transparent 70%); pointer-events: none; }
.creator-hero h2 { font-family: var(--font-display); font-size: clamp(30px, 4vw, 44px); margin: 10px 0 10px; font-weight: 600; position: relative; }
.creator-form { max-width: 640px; margin: 30px auto 0; display: flex; flex-direction: column; gap: 14px; position: relative; }
.creator-form .input { text-align: center; font-size: 19px; padding: 18px; border-color: var(--gold-line-strong); background: #0a0a0a; }
.creator-form .btn { padding: 18px; font-size: 15px; }

/* ---------- Integrations ---------- */
.integ { display: flex; flex-direction: column; gap: 14px; }
.integ-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.integ-head h3 { margin: 0; font-size: 17px; font-weight: 600; flex: 1 1 auto; }
.integ-head .integ-badge { margin-left: auto; }
.integ ul { margin: 0; padding-left: 18px; color: var(--gray); font-size: 13.5px; }
.integ ul li { margin: 3px 0; }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); z-index: 80; display: grid; place-items: center; padding: 18px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(620px, 100%); max-height: 92vh; overflow-y: auto; background: var(--black-2); border: 1px solid var(--gold-line-strong); border-radius: 18px; box-shadow: 0 30px 80px -20px #000, var(--gold-glow); padding: 26px; animation: pop .3s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.modal h2 { font-family: var(--font-display); font-size: 25px; margin: 0 0 4px; font-weight: 600; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.phone-preview { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--gold-light); font-size: 15px; }

/* ---------- Toast ---------- */
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--graphite); border: 1px solid var(--gold-line-strong); color: var(--white); padding: 13px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; max-width: 360px; animation: pop .3s var(--ease); }
.toast.err { border-color: rgba(224,108,90,.5); }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .sidebar { transform: translateX(-100%); visibility: hidden; transition: transform .35s var(--ease), visibility .35s; }
  body.nav-open .sidebar { transform: none; visibility: visible; box-shadow: 20px 0 60px rgba(0,0,0,.7); }
  body.nav-open .scrim { display: block; }
  .main { margin-left: 0; }
  .menu-btn { display: grid; place-items: center; }
  .topbar { padding: 14px 18px; }
  .topbar h1 { font-size: 22px; }
  .topbar .crumb { display: none; }
  .content { padding: 22px 16px 60px; }
}
@media (max-width: 520px) {
  .grid-kpi { grid-template-columns: 1fr 1fr; gap: 12px; }
  .kpi { padding: 16px; }
  .kpi-value { font-size: 30px; }
  .card { padding: 18px; }
  .creator-hero { padding: 40px 16px 34px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* =========================================================
   Etapas 2–8: componentes adicionais
   ========================================================= */
.hero-title { font-family: var(--font-display); font-size: clamp(28px, 3.4vw, 38px); font-weight: 600; margin: 8px 0 6px; line-height: 1.12; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attribution { font-size: 12px; margin-top: 14px; }
.btn-sm { padding: 8px 12px; font-size: 11px; }
.btn-danger { border-color: rgba(224,108,90,.5); color: #f2a497; }
.btn-danger:hover { background: rgba(224,108,90,.1); border-color: var(--danger); }
.link-btn { background: none; border: 0; padding: 0; color: var(--gold-light); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.btn.is-busy { cursor: progress; }
.input-sm { padding: 9px 12px; font-size: 14px; }
select.input-sm { padding-right: 32px; }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: transparent; display: inline-grid; place-items: center; cursor: pointer; transition: all .2s; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: var(--gold); }
.icon-btn:hover { border-color: var(--gold-line-strong); background: rgba(212,175,55,.06); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.icon-btn.danger svg { stroke: #e98b7c; }
.icon-btn.danger:hover { border-color: rgba(224,108,90,.5); background: rgba(224,108,90,.08); }
:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

/* Carregando */
.loading { display: flex; align-items: center; gap: 12px; color: var(--gray); padding: 26px 4px; font-size: 14px; }

  const hash = location.hash.replace(/^#\/?/, '');

// ----- Site publicado (modo visitante: ?site=endereco) -----
async function publicSite(slug) {
  document.body.classList.add('public-site');
  app.innerHTML = '<div class="public-loading"><span class="spinner"></span></div>';
  const fail = (title, text) => {
    document.title = title;
    app.innerHTML = `<main class="public-msg"><h1>${esc(title)}</h1><p>${esc(text)}</p></main>`;

function toast(msg, type = '') {
  let box = document.querySelector('.toasts');
  if (!box) {
    box = document.createElement('div');
    box.className = 'toasts';
    box.setAttribute('role', 'status');
    box.setAttribute('aria-live', 'polite');
    document.body.appendChild(box);
  }
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .3s';
    setTimeout(() => t.remove(), 300);
  }, type === 'err' ? 6500 : 3800);
}

function openModal(html, onMount, { wide = false, full = false, onClose } = {}) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal${wide ? ' modal-wide' : ''}${full ? ' modal-full' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  const previous = document.activeElement;
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    bg.remove();
    document.removeEventListener('keydown', onKey);
    if (previous && previous.focus && previous.isConnected) previous.focus();
    onClose?.();
  };
  const onKey = (e) => { if (e.key === 'Escape' && document.body.lastElementChild === bg) close(); };
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(bg);
  const modal = bg.querySelector('.modal');
  onMount?.(modal, close);
  const first = modal.querySelector('input:not([type=hidden]), textarea, select');
  if (first && !full) setTimeout(() => first.focus(), 30);
  return close;
}

function confirmDialog({ title, text, confirm = 'Confirmar', danger = false }) {
  return new Promise((resolve) => {
    let answer = false;
    openModal(`
      <h2>${esc(title)}</h2>
      <p class="muted" style="margin:8px 0 0">${esc(text)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close>Cancelar</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-gold'}" data-yes>${esc(confirm)}</button>
      </div>`, (m, close) => {
      m.querySelector('[data-yes]').addEventListener('click', () => { answer = true; close(); });
    }, { onClose: () => resolve(answer) });
  });
}

function emptyState({ ico = 'info', title, text, action = '' }) {
  return `<div class="empty"><div class="ico">${icon(ico)}</div><h3>${title}</h3><p>${text}</p>${action ? `<div style="margin-top:18px">${action}</div>` : ''}</div>`;
}

function notice(html, type = '') {
  const ico = type === 'info' ? 'info' : type === 'ok' ? 'check' : 'alert';
  return `<div class="notice ${type}">${icon(ico)}<div>${html}</div></div>`;
}

function sectionHead(title, sub = '', right = '') {
  return `<div class="section-head"><div><h2 class="section-title">${title}</h2>${sub ? `<div class="muted" style="font-size:13.5px">${sub}</div>` : ''}</div>${right}</div>`;
}

  return `<div class="loading"><span class="spinner"></span>${esc(text)}</div>`;
}

// Deixa um botão em estado "trabalhando" enquanto a promessa roda.
async function withBusy(button, task, busyText) {
  if (!button) return task();
  const html = button.innerHTML;
  button.disabled = true;
  button.classList.add('is-busy');
  if (busyText) button.innerHTML = `<span class="spinner"></span>${esc(busyText)}`;
  try {
    return await task();
  } finally {
    if (button.isConnected) {
      button.disabled = false;
      button.classList.remove('is-busy');
      button.innerHTML = html;
    }
  }
}

const dtf = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const df = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });

function fmtDateTime(v) {
  if (!v) return '—';
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? '—' : dtf.format(d);
}

function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? '—' : df.format(d);
}

function relTime(v) {
  if (!v) return '—';
  const diff = (Date.now() - new Date(v).getTime()) / 1000;
  if (diff < 60) return 'agora';
  if (diff < 3600) return `há ${Math.floor(diff / 60)} min`;
  if (diff < 86400) return `há ${Math.floor(diff / 3600)} h`;
  if (diff < 86400 * 7) return `há ${Math.floor(diff / 86400)} dia(s)`;
  return fmtDate(v);
}

const fmtInt = (n) => new Intl.NumberFormat('pt-BR').format(Number(n) || 0);

function errMsg(e) {
  return e instanceof Error ? e.message : String(e || 'Erro desconhecido.');
}

Object.assign(__exports, { esc, toast, openModal, confirmDialog, emptyState, notice, sectionHead, loading, withBusy, fmtDateTime, fmtDate, relTime, fmtInt, errMsg });
};

__defs["lib/config.js"] = function (__exports) {
// ===========================================================
// Configuração pública do app.
// SOMENTE valores públicos: a URL do projeto Supabase e a chave
// "publishable" (sb_publishable_...) ou "anon". A proteção real
// dos dados é o RLS no banco.
// NUNCA coloque aqui chaves do Google, da Anthropic ou a chave
// secreta/service_role do Supabase: elas ficam nos Secrets das
// Edge Functions (ver docs/CONFIGURAR.md).
//
// Ordem de leitura:
//   1. window.RADAR_CONFIG  (topo do index.html publicado)
//   2. CONFIG abaixo        (desenvolvimento)
//   3. conexão salva neste aparelho (Configurações → Conectar)
// ===========================================================
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',
};

const LOCAL_KEY = 'radar.connection.v1';

function clean(url, key) {
  return { url: String(url || '').trim().replace(/\/+$/, ''), key: String(key || '').trim() };
}

function getConfig() {
  const w = typeof window !== 'undefined' ? window.RADAR_CONFIG : null;
  if (w && w.SUPABASE_URL && w.SUPABASE_ANON_KEY) return { ...clean(w.SUPABASE_URL, w.SUPABASE_ANON_KEY), source: 'arquivo' };
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) return { ...clean(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY), source: 'arquivo' };
  try {
    const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
    if (saved && saved.url && saved.key) return { ...clean(saved.url, saved.key), source: 'aparelho' };
  } catch { /* armazenamento indisponível */ }
  return { url: '', key: '', source: '' };
}

function saveLocalConnection(url, key) {
  const c = clean(url, key);
  localStorage.setItem(LOCAL_KEY, JSON.stringify(c));
  return c;
}

function clearLocalConnection() {
  try { localStorage.removeItem(LOCAL_KEY); } catch { /* nada */ }
}

function validateConnection(url, key) {
  const c = clean(url, key);
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(c.url) && !/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(c.url)) {
    return 'URL inválida. Use o formato https://SEU-PROJETO.supabase.co';
  }
  if (/^sb_secret_/i.test(c.key) || /service_role/i.test(atobSafe(c.key))) {
    return 'Essa é a chave SECRETA. Use a chave publishable (sb_publishable_...) ou anon.';
  }
  if (!/^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(c.key) && !/^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$/.test(c.key)) {
    return 'Chave inválida. Copie a chave publishable (sb_publishable_...) ou a anon (começa com eyJ).';
  }
  return '';
}

function atobSafe(jwt) {
  try { return atob(jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')); } catch { return ''; }
}

Object.assign(__exports, { CONFIG, getConfig, saveLocalConnection, clearLocalConnection, validateConnection });
};

// ---- lib/sb.js ----
__defs["lib/sb.js"] = function (__exports) {
// ===========================================================
// Cliente mínimo do Supabase (Auth, RPC, Edge Functions, Storage)
// usando a API REST oficial — sem bibliotecas externas.
// ===========================================================
const SESSION_KEY = 'radar.session.v1';

class SupabaseError extends Error {
  constructor(message, status = 0, code = '') {
    super(message);
    this.status = status;
    this.code = code;
  }
}

const isJwt = (k) => /^eyJ/.test(k || '');

function translate(msg, status) {
  if (/invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(msg)) return 'E-mail ainda não confirmado. Crie o usuário com "Auto Confirm User" ou confirme pelo link recebido.';
  if (/could not find the function|schema cache/i.test(msg)) return 'O banco ainda não foi preparado: rode o arquivo schema.sql no SQL Editor do Supabase.';
  if (/invalid api key|no api key|unregistered api key/i.test(msg)) return 'Chave do Supabase inválida. Confira a URL e a chave publishable/anon.';
  if (/jwt expired|invalid jwt|bad_jwt/i.test(msg)) return 'Sessão expirada. Faça login novamente.';
  if (/permission denied/i.test(msg)) return 'Sem permissão para essa operação (verifique se o schema.sql foi aplicado por completo).';
  if (/signups not allowed|signup is disabled/i.test(msg)) return 'Cadastro desativado. Crie o usuário pelo painel do Supabase.';
  if (status === 429) return 'Muitas tentativas. Aguarde um pouco e tente de novo.';
  return msg;
}

function createClient(baseUrl, key) {
  const url = String(baseUrl).replace(/\/+$/, '');
  const listeners = new Set();
  let refreshing = null;
  let session = load();

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      return s && s.url === url && s.access_token ? s : null;
    } catch {
      return null;
    }
  }

  function save(next) {
    const changed = Boolean(session) !== Boolean(next);
    session = next;
    try {
      if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
      else localStorage.removeItem(SESSION_KEY);
    } catch { /* armazenamento indisponível: sessão só em memória */ }
    if (changed) listeners.forEach((fn) => { try { fn(next); } catch { /* ignora */ } });
  }

  function store(data) {
    const expiresAt = data.expires_at || Math.floor(Date.now() / 1000) + (Number(data.expires_in) || 3600);
    save({
      url,
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: expiresAt,
      user: { id: data.user?.id || '', email: data.user?.email || '' },
    });
  }

  function headers(withSession) {
    const h = { apikey: key };
    if (withSession && session?.access_token) h.Authorization = `Bearer ${session.access_token}`;
    else if (isJwt(key)) h.Authorization = `Bearer ${key}`;
    return h;
  }

  async function errorFrom(res) {
    const text = await res.text().catch(() => '');
    let data = null;
    try { data = JSON.parse(text); } catch { /* texto puro */ }
    const raw = data?.error_description || data?.msg || data?.message || (typeof data?.error === 'string' ? data.error : '') || text || `HTTP ${res.status}`;
    return new SupabaseError(translate(String(raw), res.status), res.status, String(data?.code || data?.error_code || ''));
  }

  async function doFetch(path, init) {
    try {
      return await fetch(url + path, init);
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw new SupabaseError('Não foi possível alcançar o Supabase. Verifique a internet e a URL do projeto.', 0, 'network');
    }
  }

  async function refresh() {
    const res = await doFetch('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session?.refresh_token }),
    });
    if (!res.ok) {
      save(null);
      throw new SupabaseError('Sessão expirada. Faça login novamente.', 401, 'session');
    }
    store(await res.json());
  }

  async function ensureFresh() {
    if (!session) return;
    if (session.expires_at && session.expires_at * 1000 - Date.now() > 60000) return;
    if (!refreshing) refreshing = refresh().finally(() => { refreshing = null; });
    await refreshing;
  }

  async function request(path, { method = 'GET', body, extraHeaders = {}, withSession = true, raw = false, signal } = {}) {
    if (withSession) await ensureFresh();
    const isBlob = typeof Blob !== 'undefined' && body instanceof Blob;
    const h = { ...headers(withSession), ...extraHeaders };
    if (body !== undefined && !isBlob) h['Content-Type'] = 'application/json';
    const res = await doFetch(path, {
      method,
      headers: h,
      body: body === undefined ? undefined : isBlob ? body : JSON.stringify(body),
      signal,
    });
    if (res.status === 401 && withSession && session) {
      const err = await errorFrom(res);
      save(null);
      err.message = 'Sessão expirada. Faça login novamente.';
      throw err;
    }
    if (!res.ok) throw await errorFrom(res);
    if (raw) return res;
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  return {
    url,
    key,
    get session() { return session; },
    auth: {
      async signIn(email, password) {
        const res = await doFetch('/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { apikey: key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) throw await errorFrom(res);
        store(await res.json());
        return session;
      },
      async signOut() {
        if (session) {
          try { await doFetch('/auth/v1/logout', { method: 'POST', headers: headers(true) }); } catch { /* offline */ }
        }
        save(null);
      },
      async health() {
        const res = await doFetch('/auth/v1/health', { headers: { apikey: key } });
        if (!res.ok) throw await errorFrom(res);
        return true;
      },
      onChange(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      },
      ensureFresh,
    },
    rpc: (fn, args = {}) => request(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args }),
    rpcPublic: (fn, args = {}) => request(`/rest/v1/rpc/${fn}`, { method: 'POST', body: args, withSession: false }),
    invoke: (name, body = {}) => request(`/functions/v1/${name}`, { method: 'POST', body }),
    stream: (name, body, signal) => request(`/functions/v1/${name}`, { method: 'POST', body, raw: true, signal }),
    upload: (bucket, path, blob) => request(`/storage/v1/object/${bucket}/${path}`, {
      method: 'POST',
      body: blob,
      extraHeaders: { 'Content-Type': blob.type || 'application/octet-stream', 'cache-control': 'max-age=31536000', 'x-upsert': 'false' },
    }),
    publicUrl: (bucket, path) => `${url}/storage/v1/object/public/${bucket}/${path}`,
  };
}

Object.assign(__exports, { SupabaseError, createClient });
};

__defs["lib/whatsapp.js"] = function (__exports) {
// ===========================================================
// WhatsApp: normalização de telefones brasileiros e montagem
// do link oficial wa.me. O ENVIO É SEMPRE MANUAL (pelo usuário).
// ===========================================================

const VALID_DDD = new Set([
  11,12,13,14,15,16,17,18,19, 21,22,24,27,28, 31,32,33,34,35,37,38,
  41,42,43,44,45,46,47,48,49, 51,53,54,55, 61,62,63,64,65,66,67,68,69,
  71,73,74,75,77,79, 81,82,83,84,85,86,87,88,89, 91,92,93,94,95,96,97,98,99,
]);

/**
 * Normaliza um telefone brasileiro para o formato internacional (E.164 sem "+").
 * Retorna { ok, number, display, kind, reason, warning }.
 */
function normalizeBrazilPhone(raw) {
  const input = String(raw ?? '').trim();
  if (!input) return { ok: false, reason: 'Nenhum telefone informado na fonte.' };

  let d = input.replace(/\D/g, '');
  if (/^0?(800|300|303|500|900)/.test(d)) {
    return { ok: false, reason: 'Número 0800/0300/0900 não recebe WhatsApp.' };
  }
  if (d.startsWith('00')) d = d.slice(2);            // prefixo internacional 00
  if (d.length >= 12 && d.startsWith('55')) d = d.slice(2); // código do país
  else if (d.startsWith('0')) {
    d = d.replace(/^0+/, '');
    // código de operadora (0 + XX + DDD + número)
    if (d.length === 12 || d.length === 13) d = d.slice(2);
  }

  if (d.length !== 10 && d.length !== 11) {
    return { ok: false, reason: `Telefone com quantidade de dígitos inválida (${d.length}). Esperado: DDD + 8 ou 9 dígitos.` };
  }
  const ddd = Number(d.slice(0, 2));
  if (!VALID_DDD.has(ddd)) return { ok: false, reason: `DDD ${d.slice(0, 2)} não existe no Brasil.` };

  const local = d.slice(2);
  let kind, warning = null;
  if (local.length === 9) {
    if (local[0] !== '9') return { ok: false, reason: 'Celular com 9 dígitos deve começar com 9.' };
    kind = 'celular';
  } else {
    if (/^[2-5]/.test(local)) {
      kind = 'fixo';
      warning = 'Número fixo: só funciona se a empresa usar WhatsApp Business neste número.';
    } else {
      return { ok: false, reason: 'Celular sem o nono dígito. Confirme o número antes de abordar.' };
    }
  }

  const display = local.length === 9
    ? `+55 (${d.slice(0, 2)}) ${local.slice(0, 5)}-${local.slice(5)}`
    : `+55 (${d.slice(0, 2)}) ${local.slice(0, 4)}-${local.slice(4)}`;

  return { ok: true, number: `55${d}`, display, kind, warning };
}

const TEMPLATES = {
  personalizada: 'Olá, tudo bem? Meu nome é {meu_nome}. Vi a empresa {empresa} e gostaria de apresentar uma ideia de site profissional para o negócio de vocês. Vocês já possuem um site ou teriam interesse em conhecer uma proposta?',
  inicial: 'Olá, tudo bem? Meu nome é {meu_nome}. Trabalho com criação de sites profissionais para empresas. Gostaria de saber se vocês já possuem um site ou se teriam interesse em conhecer uma proposta para apresentar melhor os serviços da empresa na internet?',
};

function fillTemplate(template, { empresa = '', meuNome = 'Nicolas' } = {}) {
  return String(template)
    .replaceAll('{empresa}', empresa.trim() || 'de vocês')
    .replaceAll('{meu_nome}', meuNome.trim() || 'Nicolas');
}

function waLink(number, message) {
  return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
}

Object.assign(__exports, { normalizeBrazilPhone, TEMPLATES, fillTemplate, waLink });
};

__defs["lib/sitehtml.js"] = function (__exports) {
// Utilitários para o HTML dos sites gerados.

const PHOTO_TOKEN = '{{FOTO}}';

// Marcador de foto (o dono troca depois pela foto real da empresa).
const PHOTO_PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23e8e4dc'/%3E%3Cg fill='none' stroke='%23a39e93' stroke-width='14' stroke-linejoin='round'%3E%3Cpath d='M300 250h40l22-34h76l22 34h40v150H300z'/%3E%3Ccircle cx='400' cy='322' r='40'/%3E%3C/g%3E%3Ctext x='400' y='460' text-anchor='middle' font-family='Arial,sans-serif' font-size='30' fill='%23857f73'%3EFoto da empresa%3C/text%3E%3C/svg%3E";

function tokenizePhotos(html) {
  return String(html || '').split(PHOTO_PLACEHOLDER).join(PHOTO_TOKEN);
}

function detokenizePhotos(html) {
  return String(html || '').split(PHOTO_TOKEN).join(PHOTO_PLACEHOLDER);
}

// Recorta o documento HTML de uma resposta da IA.
function extractHtml(text) {
  let s = String(text || '').replace(/^\s*```(?:html)?\s*/i, '');
  const start = s.search(/<!doctype html|<html[\s>]/i);
  if (start > 0) s = s.slice(start);
  const end = s.toLowerCase().lastIndexOf('</html>');
  if (start >= 0 && end >= 0) return { html: s.slice(0, end + 7), complete: true };
  return { html: s.replace(/\s*```\s*$/, ''), complete: false };
}

// Junta a continuação ao trecho já escrito, removendo repetição na emenda.
function mergeContinuation(partial, continuation) {
  const c = String(continuation || '').replace(/^\s*```(?:html)?[ \t]*\n?/i, '');
  if (/^\s*(<!doctype html|<html[\s>])/i.test(c)) return c.trimStart();
  const max = Math.min(400, partial.length, c.length);
  for (let k = max; k >= 12; k -= 1) {
    if (partial.endsWith(c.slice(0, k))) return partial + c.slice(k);
  }
  return partial + c;
}

// Para exibir: abre links externos em nova aba (o site roda isolado num iframe).
const LINK_FIX = '<script>document.addEventListener("click",function(e){var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;var h=a.getAttribute("href")||"";if(/^(https?:|mailto:|tel:)/i.test(h)){a.setAttribute("target","_blank");a.setAttribute("rel","noopener");}},true);<\/script>';

function prepareForViewer(html) {
  const s = String(html || '');
  const i = s.search(/<\/head>/i);
  return i >= 0 ? s.slice(0, i) + LINK_FIX + s.slice(i) : LINK_FIX + s;
}

function siteTitle(html) {
  const m = String(html || '').match(/<title[^>]*>([^<]*)<\/title>/i);
  return m ? m[1].trim() : '';
}

function slugify(name) {
  const base = String(name || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
    .slice(0, 60).replace(/-+$/g, '');
  return base.length >= 3 ? base : `site-${base || 'novo'}`.replace(/-+$/, '');
}

function countPhotoSlots(html) {
  return (String(html || '').match(/data-rb-image/g) || []).length;
}

Object.assign(__exports, { PHOTO_TOKEN, PHOTO_PLACEHOLDER, tokenizePhotos, detokenizePhotos, extractHtml, mergeContinuation, prepareForViewer, siteTitle, slugify, countPhotoSlots });
};

        </details>

// Gráficos do painel (HTML/CSS, desenhados só com dados do banco).

const { STATUS } = __req("lib/components.js");

const SERIES = [
  ['abordagens', 'Abordagens', 'var(--gold)'],
  ['respostas', 'Respostas', 'var(--gold-light)'],
  ['fechamentos', 'Fechamentos', '#ffffff'],
];

function weeklyChart(weeks) {
  const list = Array.isArray(weeks) ? weeks : [];
  const max = Math.max(1, ...list.flatMap((w) => SERIES.map(([k]) => Number(w[k]) || 0)));
  const total = list.reduce((acc, w) => acc + SERIES.reduce((a, [k]) => a + (Number(w[k]) || 0), 0), 0);
  const label = (iso) => {
    const [, m, d] = String(iso).split('-');
    return `${d}/${m}`;
  };
  return `
    <div class="legend">${SERIES.map(([, name, color]) => `<span><i style="background:${color}"></i>${name}</span>`).join('')}</div>
    <div class="bars" role="img" aria-label="Abordagens, respostas e fechamentos nas últimas 8 semanas">
      ${list.map((w) => `<div class="bar-group">
        <div class="bar-stack">${SERIES.map(([k, name, color]) => {
          const v = Number(w[k]) || 0;
          return `<div class="bar" style="height:${(v / max) * 100}%;background:${color}" title="${name}: ${v}">${v ? `<span>${v}</span>` : ''}</div>`;
        }).join('')}</div>
        <div class="bar-label">${label(w.week)}</div>
      </div>`).join('')}
    </div>
    ${total ? '' : '<div class="muted chart-empty">Nenhuma abordagem registrada nas últimas 8 semanas.</div>'}`;
}

function funnelChart(funnel) {
  const data = funnel && typeof funnel === 'object' ? funnel : {};
  const max = Math.max(1, ...STATUS.map(([k]) => Number(data[k]) || 0));
  return `<div class="funnel">${STATUS.map(([k, label]) => {
    const v = Number(data[k]) || 0;
    return `<div class="funnel-row">
      <span class="funnel-label">${esc(label)}</span>
      <span class="funnel-track"><span class="funnel-fill" style="width:${(v / max) * 100}%"></span></span>
      <span class="funnel-value">${fmtInt(v)}</span>
    </div>`;
  }).join('')}</div>`;
}

Object.assign(__exports, { weeklyChart, funnelChart });
};

function render() {

  return `
    <div class="card" style="padding:26px">
      <div class="eyebrow" style="margin-bottom:6px" id="radar-source">Busca real · ${esc(SOURCE_NAME[state.source] || 'Google Places ou OpenStreetMap')}</div>
      <h2 class="section-title" style="font-size:24px;margin-bottom:18px">Onde estão os seus próximos clientes?</h2>
      <form id="radar-form" class="form-grid" novalidate>

        <label class="field">Categoria
          <select class="input" name="categoria"><option value="">Todas</option>${CATEGORIAS.map((c) => `<option${i.categoria === c ? ' selected' : ''}>${c}</option>`).join('')}</select>
        </label>
        <label class="field">Segmento / termo livre<input class="input" name="segmento" placeholder="ex.: marmitaria, açaí, tatuagem" maxlength="80" value="${v('segmento')}"></label>
        <label class="field">Cidade<input class="input" name="cidade" placeholder="ex.: Parnamirim" maxlength="80" value="${v('cidade')}"></label>
        <label class="field">Estado
          <select class="input" name="uf"><option value="">Todos</option>${UFS.map(([s, n]) => `<option value="${s}"${i.uf === s ? ' selected' : ''}>${n} (${s})</option>`).join('')}</select>

        <p class="muted" style="grid-column:1/-1;margin:0;font-size:13px">Sem a chave do Google, a busca usa o OpenStreetMap (grátis) e precisa da <b style="color:var(--white)">cidade</b>.</p>
        <div class="form-actions">

          <label class="toggle"><input type="checkbox" name="comTelefone"${i.comTelefone ? ' checked' : ''}><span class="sw"></span>Apenas empresas com telefone</label>
          <button class="btn btn-gold btn-lg" type="submit" id="radar-submit">${icon('search')} Buscar empresas</button>
        </div>
      </form>
    </div>
    <div id="radar-status" style="margin-top:18px"></div>
    ${sectionHead('Resultados', 'Cada empresa aparece com ações de abordagem, salvamento e criação de site.', '<span class="muted" id="radar-count" style="font-size:13px"></span>')}

function renderResults(root) {

function statsLine() {
  const s = state.stats;

  if (r.website) parts.push(`${r.website} com site informado`);
  if (r.phone) parts.push(`${r.phone} sem telefone`);
  if (r.closed) parts.push(`${r.closed} fechada(s) definitivamente`);
  if (r.outside) parts.push(`${r.outside} fora da cidade/estado`);
  const hidden = parts.length ? `; ocultadas: ${parts.join(', ')}` : '';

  const status = root.querySelector('#radar-status');

    try {
      const body = { ...state.input, pageToken: append ? state.nextPageToken : undefined };

      const r = await api.searchPlaces(body);
      if (!root.isConnected) return;
      state.query = r.query;
      state.nextPageToken = r.nextPageToken;
      state.stats = r.stats;
      state.source = r.source || 'google_places';
      state.warning = r.warning || '';
      state.cached = Boolean(r.cached);
      const known = new Set(append ? state.results.map((x) => x.source_id) : []);
      state.results = append ? state.results.concat(r.results.filter((x) => !known.has(x.source_id))) : r.results;
      status.innerHTML = statusHtml();
      renderResults(root);
    } catch (e) {
      if (!root.isConnected) return;
      if (!append) {
        Object.assign(state, { query: null, results: [], nextPageToken: null, stats: null, warning: '' });
        root.querySelector('#radar-results').innerHTML = '';
        root.querySelector('#radar-count').textContent = '';
        root.querySelector('#radar-more').innerHTML = '';
      }
      status.innerHTML = notice(`<strong>A busca falhou.</strong> ${esc(errMsg(e))}`, 'err');
    }
  }, append ? 'Carregando…' : 'Buscando…');
}

function findCompany(id) {
  return state.results.find((c) => c.id === id);
}

async function handleCompanyAction(act, c, refresh) {
  if (act === 'wa') {
    openWhatsAppModal({
      name: c.name, phone: c.phone, companyId: c.id,
      onRegistered: (r) => { c.saved = true; c.contact_status = r.status; refresh(); },
    });
  } else if (act === 'save') {
    if (!isReady()) { toast('Conecte o Supabase e faça login para salvar.', 'err'); return; }
    try {
      const r = await api.saveCompany(c.id);
      c.saved = true;
      c.contact_status = r.status;
      toast(r.created ? 'Empresa salva no CRM.' : 'Essa empresa já estava salva.');
      refresh();
    } catch (e) { toast(errMsg(e), 'err'); }
  } else if (act === 'site') {
    location.hash = `#/criador?empresa=${encodeURIComponent(c.name)}${c.id ? `&company=${encodeURIComponent(c.id)}` : ''}`;
  } else if (act === 'details') {
    openDetailsModal(c, { onAction: (a) => handleCompanyAction(a, c, refresh) });
  }
}

function mount(root) {
  const form = root.querySelector('#radar-form');
  const status = root.querySelector('#radar-status');
  if (state.query) {
    status.innerHTML = statusHtml();
    renderResults(root);
  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(form);
    const input = {
      nome: String(f.get('nome') || '').trim(), categoria: String(f.get('categoria') || ''), segmento: String(f.get('segmento') || '').trim(),
      cidade: String(f.get('cidade') || '').trim(), uf: String(f.get('uf') || ''), semSite: f.get('semSite') === 'on', comTelefone: f.get('comTelefone') === 'on',
    };
    if (!input.nome && !input.categoria && !input.segmento && !input.cidade) {
      status.innerHTML = notice('Informe pelo menos <strong>nome, categoria, segmento ou cidade</strong> para buscar.', 'err');
      return;
    }
    state.input = input;
    if (!isConfigured()) {
      status.innerHTML = notice('<strong>Busca não executada: o Supabase não está conectado.</strong> Nenhum resultado é exibido para não apresentar empresas inventadas. Conecte em <a href="#/configuracoes">Configurações</a>.', 'err');
      return;
    }
    search(root);
  });
  root.addEventListener('click', (e) => {
    if (e.target.closest('#radar-next')) { search(root, { append: true }); return; }
    const b = e.target.closest('[data-act]');
    const card = e.target.closest('.company-card');
    if (!b || !card) return;
    const c = findCompany(card.dataset.id);
    if (!c) return;
    handleCompanyAction(b.dataset.act, c, () => { if (root.isConnected) renderResults(root); });
  });
}

Object.assign(__exports, { title, UFS, render, handleCompanyAction, mount });
};

function progressPanel(el, { withResearch = true } = {}) {
  el.innerHTML = `<div class="card gen-panel">

async function generateWithProgress(panel, { companyName, companyId, webSearch = true, signal }) {

      if (p.kind === 'search_error') panel.log(`${icon('alert')} Uma busca falhou (${esc(p.code)}).`);

    sources: research.sources,
    model: result.model || research.model,

    output_tokens: (result.usage?.output_tokens || 0) + (research.usage?.output_tokens || 0),

function mount(root, params) {
  const form = root.querySelector('#cr-form');
  const input = root.querySelector('#cr-name');
  const status = root.querySelector('#cr-status');
  const companyId = params.get('company') || null;
  if (!input.value) input.focus();
  if (running) status.innerHTML = notice('Já existe uma geração em andamento. Aguarde terminar.', 'info');

  async function start(webSearch) {
    const nome = input.value.replace(/\s+/g, ' ').trim();
    if (nome.length < 2) { status.innerHTML = notice('Digite o nome da empresa (mínimo de 2 caracteres).', 'err'); input.focus(); return; }

      status.innerHTML = notice('<strong>Site não gerado: o Supabase não está conectado.</strong> A geração não é simulada — conecte em <a href="#/configuracoes">Configurações</a>.', 'err');

      const sameCompany = companyId && params.get('empresa') === nome ? companyId : null;

      const saved = await api.createProject(nome, sameCompany, g.html, g);

      running = null;

        panel.fail('Geração cancelada.');
      } else {
        const retry = `<div class="row-actions" style="margin-top:12px"><button class="btn" id="cr-retry">${icon('refresh')} Tentar novamente</button>${e.retryWithoutSearch ? `<button class="btn" id="cr-nosearch">${icon('search')} Gerar sem pesquisa na web</button>` : ''}</div>`;

        status.querySelector('#cr-nosearch')?.addEventListener('click', () => start(false));
        status.querySelector('#cr-retry')?.addEventListener('click', () => start(true));
      }
    } finally {
      if (goBtn.isConnected) goBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); start(true); });

__defs["lib/generator.js"] = function (__exports) {
// Orquestra a geração no backend: briefing (pesquisa) → HTML em streaming,
// continuando automaticamente se uma etapa atingir o limite de tempo.
const { sb } = __req("lib/api.js");
const { extractHtml, mergeContinuation, tokenizePhotos, detokenizePhotos } = __req("lib/sitehtml.js");

async function streamStage(body, onEvent, signal) {
  let res;
  try {
    res = await sb().stream('generate-site', body, signal);
  } catch (e) {
    if (e.code === 'network') {
      e.message = 'Não foi possível chamar a função "generate-site". Verifique se ela foi publicada em Edge Functions no Supabase.';
    } else if (e.status === 404 && /not found/i.test(e.message)) {
      e.message = 'A função "generate-site" ainda não foi publicada no Supabase (Edge Functions).';
    }
    throw e;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let done = null;
  let error = null;
  for (;;) {
    let chunk;
    try {
      chunk = await reader.read();
    } catch (e) {
      if (signal?.aborted) throw e;
      break; // conexão encerrada pelo servidor (limite de tempo): o chamador decide continuar
    }
    if (chunk.done) break;
    buf += decoder.decode(chunk.value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, i);
      buf = buf.slice(i + 2);
      const data = block.split('\n').filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trim()).join('');
      if (!data) continue;
      let ev;
      try { ev = JSON.parse(data); } catch { continue; }
      if (ev.type === 'error') error = ev.message || 'Erro na geração.';
      else if (ev.type === 'done') done = ev;
      onEvent(ev);
    }
  }
  if (error) throw new Error(error);
  return done;
}

async function runBrief({ companyName, companyId, webSearch = true, onProgress = () => {}, signal }) {
  let brief = null;
  let sources = [];
  const done = await streamStage(
    { stage: 'brief', company_name: companyName, company_id: companyId || null, web_search: webSearch },
    (ev) => {
      if (ev.type === 'search') onProgress({ kind: 'search', query: ev.query });
      else if (ev.type === 'results') onProgress({ kind: 'results', items: ev.items || [] });
      else if (ev.type === 'search_error') onProgress({ kind: 'search_error', code: ev.code });
      else if (ev.type === 'brief') { brief = ev.brief; sources = ev.sources || []; }
    },
    signal,
  );
  if (!brief) {
    const err = new Error(done
      ? 'A IA não devolveu o briefing. Tente novamente.'
      : 'A pesquisa foi interrompida antes de terminar (limite de tempo da função).');
    err.retryWithoutSearch = webSearch;
    throw err;
  }
  return { brief, sources, usage: done?.usage || null, model: done?.model || null };
}

// mode: 'html' (novo site a partir do briefing) ou 'edit' (alteração pedida em texto)
async function runHtml({ mode, brief, html = '', instruction = '', onProgress = () => {}, signal }) {
  const baseHtml = tokenizePhotos(html);
  const usage = { input_tokens: 0, output_tokens: 0 };
  let model = null;
  let text = '';
  for (let attempt = 0; attempt < 6; attempt += 1) {
    let piece = '';
    const body = attempt === 0
      ? { stage: mode, mode, brief, html: baseHtml, instruction }
      : { stage: 'continue', mode, brief, html: baseHtml, instruction, partial: text };
    const done = await streamStage(body, (ev) => {
      if (ev.type === 'delta') {
        piece += ev.text;
        onProgress({ kind: 'html', chars: text.length + piece.length, part: attempt + 1 });
      }
    }, signal);
    if (done?.usage) {
      usage.input_tokens += done.usage.input_tokens || 0;
      usage.output_tokens += done.usage.output_tokens || 0;
      model = done.model || model;
    }
    text = attempt === 0 ? extractHtml(piece).html : mergeContinuation(text, piece);
    const result = extractHtml(text);
    if (result.complete) {
      return { html: detokenizePhotos(result.html), usage, model, parts: attempt + 1 };
    }
    if (!piece.trim()) throw new Error('A geração não avançou. Tente novamente em instantes.');
    onProgress({ kind: 'continue', part: attempt + 2 });
  }
  throw new Error('Não foi possível concluir o HTML após várias continuações. Tente novamente.');
}

Object.assign(__exports, { streamStage, runBrief, runHtml });
};

async function load(root) {
  const list = root.querySelector('#pj-list');
  if (!isReady()) {
    list.innerHTML = emptyState({ ico: 'projects', title: 'Projetos indisponíveis', text: 'Conecte o Supabase e faça login para ver seus sites.' });
    return;
  }
  list.innerHTML = loading('Carregando projetos…');
  try {
    state.rows = await api.listProjects(state.status);
  } catch (e) {
    list.innerHTML = notice(esc(errMsg(e)), 'err');
    return;

  if (!root.isConnected) return;
  list.innerHTML = state.rows.length
    ? `<div class="grid grid-3">${state.rows.map(card).join('')}</div>`

  });

      await api.setProjectStatus(sel.closest('.project-card').dataset.id, sel.value);
      toast('Status do projeto atualizado.');
      load(root);
    } catch (err) { toast(errMsg(err), 'err'); load(root); }
  });
  root.querySelector('#pj-list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const p = state.rows.find((r) => r.id === b.closest('.project-card').dataset.id);
    if (!p) return;
    if (b.dataset.act === 'view') {
      try {
        const full = await api.getProject(p.id);
        if (!full.current) { toast('Este projeto ainda não tem versão gerada.', 'err'); return; }
        openSitePreview(full.current.html, `${p.company_name} · versão ${full.current.version}`);
      } catch (err) { toast(errMsg(err), 'err'); }
    } else if (b.dataset.act === 'publish') {
      openPublishModal(p, () => load(root));
    } else if (b.dataset.act === 'delete') {
      const ok = await confirmDialog({ title: 'Excluir projeto?', text: `O site de "${p.company_name}" e todas as versões serão apagados${p.status === 'publicado' ? ' e o link público deixará de funcionar' : ''}.`, confirm: 'Excluir', danger: true });
      if (!ok) return;
      try { await api.deleteProject(p.id); toast('Projeto excluído.'); load(root); } catch (err) { toast(errMsg(err), 'err'); }
    }
  });
}

Object.assign(__exports, { title, render, mount });
};

  }

    const doc = iframe.contentDocument;
    if (!doc || !doc.body) return;
    const style = doc.createElement('style');
    style.id = 'rb-editor-style';
    style.textContent = EDITOR_CSS;
    (doc.head || doc.documentElement).appendChild(style);
    doc.body.querySelectorAll('*').forEach((el) => {
      if (SKIP.has(el.tagName.toUpperCase()) || el.closest('svg')) return;

      const target = e.target;

      if (img) {

    doc.addEventListener('submit', (e) => e.preventDefault(), true);
    doc.addEventListener('input', () => { dirty = true; onChange?.(); });
  }

  function serialize() {
    if (mode !== 'edit' || !iframe?.contentDocument) return current;
    const doc = iframe.contentDocument;
    const clone = doc.documentElement.cloneNode(true);
    clone.querySelector('#rb-editor-style')?.remove();
    clone.querySelectorAll('[data-rb-edit]').forEach((el) => {
      el.removeAttribute('contenteditable');
      el.removeAttribute('data-rb-edit');

  rebuild();

    setDevice,
    get mode() { return mode; },
    get html() { return current; },
    view(nextHtml) {
      if (typeof nextHtml === 'string') current = nextHtml;
      mode = 'view';

    },
    edit() {
      mode = 'edit';
      rebuild();

      selected.setAttribute('src', url);
      selected.removeAttribute('srcset');
      dirty = true;
      onChange?.();
      return true;
    },
    getHtml: serialize,
  };
}

async function resizeImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error('Use uma imagem JPG, PNG ou WebP.');
  if (file.size > 25 * 1024 * 1024) throw new Error('Imagem muito grande (máximo 25 MB).');
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.84));
  if (!blob) throw new Error('Não foi possível processar a imagem.');
  return blob;
}

      ${c.source === 'aparelho' ? `<button class="btn btn-ghost" id="sb-forget">${icon('x')} Desconectar</button>` : ''}
    </div>`;
}

function render() {
  const c = getConfig();
  const p = getPrefs();
  const s = currentSession();
  return `
    ${sectionHead('Integrações', 'Cada estado abaixo vem de um teste real feito agora — nada aparece como conectado sem teste.', isReady() ? `<button class="btn" id="int-refresh">${icon('refresh')} Testar todas</button>` : '')}
    <div class="grid grid-2">
      ${integ('supabase', 'database', 'Supabase', c.url ? BADGE.warn('Testando…') : BADGE.off('Não configurado'), connectionBody(c))}
      ${integ('places', 'radar', 'Google Places API (opcional)', isReady() ? BADGE.warn('Testando…') : BADGE.off('Aguardando Supabase'),
        `<ul><li>Busca de empresas mais completa (função <code>places-search</code>). Exige conta com faturamento no Google.</li><li id="places-detail">${isReady() ? 'Testando…' : 'Teste disponível após conectar o Supabase e entrar.'}</li><li>A chave fica no Supabase (secret <code>GOOGLE_PLACES_API_KEY</code>), nunca no navegador.</li></ul>`)}
      ${integ('osm', 'map', 'OpenStreetMap (grátis)', isReady() ? BADGE.warn('Testando…') : BADGE.off('Aguardando Supabase'),
        `<ul><li>Busca gratuita, sem chave e sem cadastro. Usada quando o Google não está configurado ou falha.</li><li id="osm-detail">${isReady() ? 'Testando…' : 'Teste disponível após conectar o Supabase e entrar.'}</li><li>Tem menos empresas e telefones que o Google. Dados © colaboradores do OpenStreetMap (ODbL).</li></ul>`)}
      ${integ('anthropic', 'sparkle', 'API Anthropic (Claude)', isReady() ? BADGE.warn('Testando…') : BADGE.off('Aguardando Supabase'),
        `<ul><li>Geração de sites (função <code>generate-site</code>).</li><li id="anthropic-detail">${isReady() ? 'Testando…' : 'Teste disponível após conectar o Supabase e entrar.'}</li><li>A chave fica no Supabase (secret <code>ANTHROPIC_API_KEY</code>), nunca no navegador.</li></ul>`)}
      ${integ('whatsapp', 'whatsapp', 'WhatsApp', BADGE.ok('Pronto · sem API'),
        '<ul><li>Usa o link oficial <code>wa.me</code>: abre o WhatsApp/WhatsApp Web com a mensagem pronta.</li><li>Envio sempre manual. Não precisa de chave nem conta comercial.</li></ul>')}
    </div>

    ${sectionHead('Mensagem de abordagem', 'Usada no botão "Abordar pelo WhatsApp". Variáveis: {empresa} e {meu_nome}.')}
    <div class="grid grid-2">
      <div class="card">
        <form id="pf-form" novalidate>
          <label class="field">Seu nome na mensagem<input class="input" id="pf-nome" value="${esc(p.meuNome)}" maxlength="60"></label>
          <label class="field" style="margin-top:14px">Modelo padrão
            <select class="input" id="pf-tpl">
              <option value="personalizada">Personalizada com o nome da empresa</option>
              <option value="inicial">Mensagem inicial padrão</option>
              <option value="custom">Meu modelo personalizado</option>
            </select>
          </label>
          <label class="field" style="margin-top:14px" id="pf-custom-wrap">Meu modelo
            <textarea class="input" id="pf-custom" maxlength="2000" placeholder="Olá! Aqui é o {meu_nome}. Vi a {empresa}…">${esc(p.customTemplate)}</textarea>
          </label>
          <button class="btn btn-gold" type="submit" style="margin-top:16px">${icon('check')} Salvar preferências</button>
          <div class="muted" style="font-size:12px;margin-top:10px">${isReady() ? 'Salvo no seu perfil (banco de dados).' : 'Sem login: fica salvo só neste aparelho.'}</div>
        </form>
      </div>
      <div class="card">
        <h3 style="margin:0 0 4px;font-size:17px">Abordagem manual</h3>
        <div class="muted" style="font-size:13.5px;margin-bottom:14px">Para empresas que você não encontrou pelo Radar: digite o telefone e o nome.</div>
        <label class="field">Nome da empresa<input class="input" id="wt-name" maxlength="120" placeholder="ex.: Quentinha Caseira"></label>
        <label class="field" style="margin-top:14px">Telefone<input class="input" id="wt-phone" inputmode="tel" maxlength="40" placeholder="ex.: (84) 99999-9999"></label>
        <div id="wt-result" style="margin-top:12px;font-size:14px;min-height:22px"></div>
        <button class="btn btn-gold btn-block" id="wt-go" style="margin-top:12px" disabled>${icon('whatsapp')} Abordar pelo WhatsApp</button>
      </div>
    </div>

    ${s ? `${sectionHead('Conta')}
    <div class="card account-card">
      <div><div class="muted" style="font-size:12px">Conectado como</div><b>${esc(s.user.email)}</b></div>
      <button class="btn" id="logout">${icon('logout')} Sair</button>
    </div>` : ''}`;
}

async function testSupabase(root) {
  const card = root.querySelector('[data-integ="supabase"]');
  const detail = root.querySelector('#sb-detail');
  if (!card || !detail) return;
  const badge = card.querySelector('.integ-badge');
  badge.innerHTML = BADGE.warn('Testando…');
  try {
    await sb().auth.health();
    if (!isReady()) {
      badge.innerHTML = BADGE.ok('Conectado');
      detail.textContent = 'Servidor respondeu. Entre com seu usuário para testar o banco.';
      return;
    }
    await sb().rpc('get_profile');
    badge.innerHTML = BADGE.ok('Conectado');
    detail.innerHTML = `Servidor, login e banco respondendo (tabelas e funções instaladas). Testado ${fmtDateTime(new Date())}.`;
  } catch (e) {
    badge.innerHTML = BADGE.err('Falhou');
    detail.innerHTML = `<span style="color:var(--danger)">${esc(errMsg(e))}</span>`;
  }
}

async function testServer(root) {
  if (!isReady()) return;
  const set = (key, html, detailText) => {
    const card = root.querySelector(`[data-integ="${key}"]`);
    if (!card) return;
    card.querySelector('.integ-badge').innerHTML = html;
    const d = root.querySelector(`#${key}-detail`);
    if (d) d.innerHTML = detailText;
  };
  set('places', BADGE.warn('Testando…'), 'Testando…');
  set('osm', BADGE.warn('Testando…'), 'Testando…');
  set('anthropic', BADGE.warn('Testando…'), 'Testando…');
  try {
    const r = await api.integrations();
    const show = (key, x, okText) => set(key,
      x.ok ? BADGE.ok(okText) : x.configured ? BADGE.err('Falhou') : BADGE.off('Não configurado'),
      x.ok ? esc(x.message) : `<span style="color:${x.configured ? 'var(--danger)' : 'var(--gray)'}">${esc(x.message)}</span>`);
    show('places', r.places, 'Conectado');
    if (!r.places.configured) {
      set('places', BADGE.off('Não configurado'), `<span style="color:var(--gray)">${esc(r.places.message)} A busca usa o OpenStreetMap (grátis).</span>`);
    }
    if (r.osm) {
      show('osm', r.osm, r.search_source === 'osm' ? 'Em uso' : 'Reserva');
      if (!r.osm.ok) set('osm', BADGE.warn('Sem resposta agora'), `<span style="color:var(--gray)">${esc(r.osm.message)}</span>`);
    } else {
      set('osm', BADGE.off('Atualize as funções'), 'Publique a nova versão da função integrations-status.');
    }
    show('anthropic', r.anthropic, r.anthropic.model_name || 'Conectado');
  } catch (e) {
    const msg = `<span style="color:var(--danger)">${esc(errMsg(e))}</span>`;
    set('places', BADGE.err('Indisponível'), msg);
    set('osm', BADGE.err('Indisponível'), msg);
    set('anthropic', BADGE.err('Indisponível'), msg);
  }
}

function mount(root, params, ctx) {
  const c = getConfig();
  if (c.url) {
    testSupabase(root);
    testServer(root);
  }
  root.querySelector('#int-refresh')?.addEventListener('click', (e) => withBusy(e.currentTarget, () => Promise.all([testSupabase(root), testServer(root)]), 'Testando…'));
  root.querySelector('#sb-test')?.addEventListener('click', (e) => withBusy(e.currentTarget, () => testSupabase(root), 'Testando…'));
  root.querySelector('#sb-forget')?.addEventListener('click', async () => {
    await sb()?.auth.signOut();
    clearLocalConnection();
    resetClient();
    toast('Supabase desconectado deste aparelho.');
    ctx?.restart?.();
  });

  const sbForm = root.querySelector('#sb-form');
  sbForm?.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = new FormData(sbForm);
    const url = String(f.get('url') || '').trim().replace(/\/+$/, '');
    const key = String(f.get('key') || '').trim();
    const msg = root.querySelector('#sb-msg');
    const invalid = validateConnection(url, key);
    if (invalid) { msg.innerHTML = notice(esc(invalid), 'err'); return; }
    withBusy(sbForm.querySelector('[type=submit]'), async () => {
      try {
        await createClient(url, key).auth.health();
        saveLocalConnection(url, key);
        resetClient();
        toast('Supabase conectado. Agora entre com seu usuário.');
        ctx?.restart?.();
      } catch (err) {
        msg.innerHTML = notice(`${esc(errMsg(err))}<br><span class="muted">Se você está na prévia dentro do Claude, a conexão é bloqueada por segurança: use o app publicado (veja o guia).</span>`, 'err');
      }
    }, 'Testando…');
  });

  const p = getPrefs();
  const tpl = root.querySelector('#pf-tpl');
  const wrap = root.querySelector('#pf-custom-wrap');
  tpl.value = p.templateKey;
  const toggleCustom = () => { wrap.style.display = tpl.value === 'custom' ? '' : 'none'; };
  tpl.addEventListener('change', toggleCustom);
  toggleCustom();
  root.querySelector('#pf-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = root.querySelector('#pf-nome').value.trim();
    const custom = root.querySelector('#pf-custom').value;
    if (!name) { toast('Informe seu nome.', 'err'); return; }
    if (tpl.value === 'custom' && !custom.trim()) { toast('Escreva o seu modelo antes de salvar.', 'err'); return; }
    withBusy(e.submitter || root.querySelector('#pf-form [type=submit]'), async () => {
      try {
        if (isReady()) await api.updateProfile(name, tpl.value, custom);
        else setPrefs({ meuNome: name, templateKey: tpl.value, customTemplate: custom });
        toast('Preferências salvas.');
      } catch (err) { toast(errMsg(err), 'err'); }
    }, 'Salvando…');
  });

  const phone = root.querySelector('#wt-phone');
  const name = root.querySelector('#wt-name');
  const out = root.querySelector('#wt-result');
  const go = root.querySelector('#wt-go');
  phone.addEventListener('input', () => {
    if (!phone.value.trim()) { out.innerHTML = ''; go.disabled = true; return; }
    const n = normalizeBrazilPhone(phone.value);
    go.disabled = !n.ok;
    out.innerHTML = n.ok
      ? `<span class="badge badge-ok">válido · ${n.kind}</span> <span class="phone-preview">${esc(n.display)}</span>${n.warning ? `<div class="muted" style="font-size:12.5px;margin-top:6px">${esc(n.warning)}</div>` : ''}`
      : `<span class="badge badge-err">inválido</span> <span class="muted">${esc(n.reason)}</span>`;
  });
  go.addEventListener('click', () => openWhatsAppModal({ name: name.value.trim(), phone: phone.value }));

  root.querySelector('#logout')?.addEventListener('click', async (e) => {
    await withBusy(e.currentTarget, () => sb().auth.signOut(), 'Saindo…');
  });

  if (isReady()) loadProfile().catch(() => {});
}

Object.assign(__exports, { title, render, mount });
};

__req("app.js");
})();

</script>
